[package]
name = "freebuff-driver"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "OpenRemote harness driver for the Freebuff CLI"
publish = false

[dependencies]
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = "thin"
